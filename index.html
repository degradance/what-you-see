<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A live dashboard of public data feeds, framed as a conspiracy board. All data is public and real. All connections are made up."
    />
    <title>What You See?</title>
    <meta name="theme-color" content="#0b0c0e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="What You See?" />
    <meta
      property="og:description"
      content="A live dashboard of public data feeds, framed as a conspiracy board. All data is public and real. All connections are made up."
    />
    <meta property="og:url" content="https://degradance.github.io/what-you-see/" />
    <meta property="og:image" content="https://degradance.github.io/what-you-see/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Applies the saved theme before first paint; dark is the default regardless of the system setting. -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          if (localStorage.getItem('wys-theme') === 'light') theme = 'light'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
