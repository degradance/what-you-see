<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A live dashboard of public data feeds, framed as a conspiracy board. All data is public and real. All connections are made up."
    />
    <title>What You See?</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ff5566'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Georgia,serif' text-anchor='middle' fill='%230b0c0e'%3E?%3C/text%3E%3C/svg%3E"
    />
    <!-- Applies the saved theme before first paint; dark is the default regardless of the system setting. -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          if (localStorage.getItem('wys-theme') === 'light') theme = 'light'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
